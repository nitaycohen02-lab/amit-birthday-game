<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AMIT'S BIRTHDAY GAME</title>
  <meta name="description" content="Amit's Birthday Game — Season 4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root{--bg:#0a0a0a;--card:#151515;--cream:#f1e8d5;--gold:#c9a96a;--muted:#9a9388;--ok:#8cbf8c;--warn:#d8a44b;--danger:#d46a6a}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#070707,#111);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
    .app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(24px + env(safe-area-inset-bottom))}
    .top{position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);padding:14px 0 10px;z-index:20;border-bottom:1px solid #222}
    .brand{font-weight:800;letter-spacing:.08em;font-size:14px;color:var(--gold)}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
    .pill{border:1px solid #2d2d2d;border-radius:999px;padding:6px 9px;background:#101010}
    .meter{height:7px;background:#262626;border-radius:999px;overflow:hidden;margin-top:10px}.meter>div{height:100%;background:var(--gold);width:0%;transition:.4s}
    .screen{padding:20px 0 80px}.hero{padding:28px 18px;border:1px solid #2a2a2a;background:radial-gradient(circle at top,#1d1a14,#111 55%);border-radius:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    h1{font-size:34px;line-height:.95;margin:8px 0 10px;letter-spacing:.02em} h2{font-size:26px;margin:0 0 12px} h3{font-size:18px;margin:0 0 10px}.sub{color:var(--muted);font-size:14px;line-height:1.6}.gold{color:var(--gold)}
    button{width:100%;border:none;border-radius:16px;padding:15px 16px;font-weight:800;font-size:16px;margin-top:12px;background:var(--gold);color:#111;cursor:pointer}
    button.secondary{background:#1c1c1c;color:var(--cream);border:1px solid #333} button.ghost{background:transparent;color:var(--gold);border:1px solid #3b3427} button.danger{background:#3a1717;color:#ffdada}
    .card{border:1px solid #2b2b2b;border-radius:20px;background:var(--card);padding:18px;margin:14px 0}.q{font-size:20px;font-weight:800;line-height:1.35}.answers{display:grid;gap:10px;margin-top:14px}.answer{background:#1c1c1c;color:var(--cream);border:1px solid #333;text-align:right}.answer:hover{border-color:#5b4c32}.feedback{margin-top:12px;padding:12px;border-radius:14px;background:#101010;border:1px dashed #3a3a3a;line-height:1.6}
    .locked{opacity:.55}.route{display:grid;gap:8px}.route-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #292929;border-radius:14px;padding:11px 12px;background:#111}.small{font-size:12px;color:var(--muted)}
    .code{display:flex;gap:8px;direction:ltr}.code input{flex:1;background:#0d0d0d;border:1px solid #333;color:var(--cream);border-radius:14px;padding:14px;font-size:20px;letter-spacing:.2em;text-align:center}
    .hidden{display:none!important}.archive{border-left:3px solid var(--gold)} .center{text-align:center}.big{font-size:48px}.final{background:#090909;border-color:#383128}.gm{position:fixed;left:16px;bottom:18px;width:44px;height:44px;border-radius:50%;padding:0;margin:0;background:#171717;color:#777;border:1px solid #2d2d2d;font-size:18px;z-index:30}.gm-panel{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;overflow:auto;padding:30px 18px}.gm-panel .inner{max-width:520px;margin:auto}.row{display:flex;gap:10px}.row>*{flex:1}.gm-panel input,.gm-panel select{width:100%;background:#111;border:1px solid #333;color:#eee;padding:12px;border-radius:12px;margin:6px 0 12px}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #444;color:#fff;padding:12px 16px;border-radius:14px;z-index:100;max-width:90%;text-align:center}
  
    .hint{border-right:3px solid var(--gold);padding:10px 12px;background:#111;border-radius:12px;margin:10px 0;line-height:1.55}
    .inline{display:flex;gap:8px;align-items:stretch}.inline input{min-width:0;flex:1}.inline button{width:auto;min-width:105px;margin:0}
    .inline input,.free-input{background:#0f0f0f;color:#fff;border:1px solid #363636;border-radius:14px;padding:14px;font-size:17px;outline:none}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:120;display:flex;align-items:center;justify-content:center;padding:22px}
    .modal-box{width:100%;max-width:460px;background:linear-gradient(180deg,#1b160f,#111);border:1px solid #5b4726;border-radius:24px;padding:24px;text-align:center;box-shadow:0 30px 90px #000}
    .pause{min-height:58vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
    .approval-gate{border:1px solid #4a402f;background:linear-gradient(180deg,#18140e,#111);border-radius:20px;padding:18px;margin:14px 0;text-align:center}
    .approval-gate.ready{border-color:#6a5835}.approval-gate.waiting{box-shadow:0 0 0 1px rgba(201,169,106,.12) inset}
    .approval-gate .status{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
    .gm-status{padding:12px;border:1px dashed #444;border-radius:14px;margin:12px 0;line-height:1.55}
    @media(max-width:380px){.inline{flex-direction:column}.inline button{width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="top hidden" id="topbar">
    <div class="brand">AMIT'S BIRTHDAY GAME • SEASON 4</div>
    <div class="stats"><span class="pill">🏆 <b id="score">0</b></span><span class="pill">❤️❤️❤️</span><span class="pill">🚨 <b id="disaster">0%</b></span><span class="pill">LVL <b id="lvl">0</b></span></div>
    <div class="meter"><div id="progressBar"></div></div>
  </div>
  <main id="screen" class="screen"></main>
</div>
<button class="gm hidden" id="gmBtn" title="Game Master">⚙️</button>

<div id="gmPanel" class="gm-panel hidden"><div class="inner">
  <h2>GAME MASTER</h2><p class="sub">מצב סודי לנתאי</p>
  <div class="card">
    <label>Disaster Meter</label><input type="number" min="0" max="100" id="gmDisaster"/>
    <label>נקודות</label><input type="number" id="gmScore"/>
    <label>שעת ספא</label><input id="gmSpaTime" placeholder="למשל 16:00"/>
    <label>משך ספא</label><input id="gmSpaDuration" placeholder="למשל 60 דקות"/>
    <label>מספר חדר</label><input id="gmRoom" placeholder="למשל 824"/>
    <label>Observation בחדר</label><input id="gmRoomObs" placeholder="למשל 4 כריות"/>
    <label>קוד כספת</label><input id="gmSafe" maxlength="4" placeholder="2584"/>
    <button onclick="saveGMSettings()">שמור הגדרות</button>
  </div>
  <div class="card">
    <h3>אישור מעבר לשלב הבא</h3>
    <div id="gmApprovalStatus" class="gm-status"></div>
    <button id="gmApproveBtn" onclick="approveNextLevel()">APPROVE NEXT LEVEL</button>
  </div>
  <div class="card">
    <label>פתיחה ידנית / חילוץ</label><select id="gmLevel"></select>
    <button class="secondary" onclick="forceLevel()">FORCE OPEN LEVEL</button>
  </div>
  <button class="secondary" onclick="closeGM()">סגור</button>
  <button class="danger" onclick="resetGame()">איפוס מלא</button>
</div></div>

<div id="toast" class="toast hidden"></div>

<div id="packingModal" class="modal hidden">
  <div class="modal-box">
    <div class="big">⚠️</div>
    <h2>רגע לפני שממשיכים...</h2>
    <p><b>לוודא שהשמלות באמת בתוך התיק.</b></p>
    <div class="feedback gold">Hotel Cramim, 2025. Never Forget.</div>
    <button onclick="closePackingModal()">בדקתי. השמלות בתיק ✓</button>
  </div>
</div>

<script>
const LEVELS=['PACKING MISSION','BIRTHDAY MORNING','THE RABBINATE','CAFE MARIE','ROAD TO TEL AVIV','HOTEL MODE','BIRTHDAY ARCHIVES','GET READY','QUMRAN','FINAL BOSS'];
const DEF={started:false,score:0,disaster:0,level:0,substage:'main',unlocked:[0],done:{},hints:{},settings:{spaTime:'TBD',spaDuration:'TBD',room:'TBD',roomObs:'TBD',safe:'2584'}};
let S; try{S=JSON.parse(localStorage.getItem('amitGameV4'))||JSON.parse(JSON.stringify(DEF))}catch(e){S=JSON.parse(JSON.stringify(DEF))}
const $=id=>document.getElementById(id), screenEl=$('screen');
function save(){localStorage.setItem('amitGameV4',JSON.stringify(S));topUI()}
function topUI(){$('score').textContent=S.score;$('disaster').textContent=S.disaster+'%';$('lvl').textContent=S.level;$('progressBar').style.width=Math.min(100,S.level/9*100)+'%'}
function toast(t){let x=$('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),1700)}
function add(n){S.score+=n;save();toast((n>0?'+':'')+n+' POINTS')}
function norm(v){return (v||'').toLowerCase().trim().replace(/[׳']/g,"'").replace(/\s+/g,' ')}
function accepted(v,arr){v=norm(v);if(arr.includes('*'))return v.length>0;return arr.some(a=>v.includes(norm(a)))}
function mcq(key,text,answers){return `<div class="card"><div class="q">${text}</div><div class="answers">${answers.map(a=>`<button class="answer" onclick="mcqPick('${key}',${a.ok},\`${a.msg}\`)">${a.t}</button>`).join('')}</div><div id="fb-${key}" class="feedback hidden"></div></div>`}
function mcqPick(key,ok,msg){if(S.done[key])return;const fb=$('fb-'+key);fb.innerHTML=msg;fb.classList.remove('hidden');if(ok){S.done[key]=true;add(10);save();refreshApprovalGate()}else{toast('❌ לא נכון — נסי שוב')}}
function textQ(key,text,answers,success,points=10,placeholder='הקלידי תשובה...'){return `<div class="card"><h3>${text}</h3><div class="inline"><input class="free-input" id="in-${key}" placeholder="${placeholder}"><button onclick='checkText("${key}",${JSON.stringify(answers)},${JSON.stringify(success)},${points})'>בדיקה</button></div><div id="fb-${key}" class="feedback hidden"></div></div>`}
function checkText(key,answers,success,points){if(S.done[key])return;let v=$('in-'+key).value;if(accepted(v,answers)){S.done[key]=true;if(points)add(points);save();$('fb-'+key).innerHTML=success;$('fb-'+key).classList.remove('hidden');if(key==='p2')setTimeout(showPackingModal,350);refreshApprovalGate()}else toast('❌ נסי שוב')}
const H={
 rabbinate:['💍 יש קשר לחתונה.','📄 אנחנו צריכים לפתוח משהו, וזה לא בקבוק שמפניה.','🇮🇱 המקום שבו רומנטיקה פוגשת בירוקרטיה.'],
 marie:['☕ במקום הבא לא חותמים על שום דבר.','📍 חוזרים לעיר שבה הכול התחיל, למרות שהתעקשנו שלא.','👩🏻 השם שאת מחפשת הוא שם של אישה.','☕ MAR_ _'],
 ta:['🌊 אנחנו מתקרבים לים.','🚗 ים, פקקים, ו־₪50 לקפה נשמע פתאום סביר.'],
 hotel:['👑 משהו מלכותי בשם.','🌊 החלק השני של השם נמצא ממש מולך כשעומדים על החוף.','🇬🇧 שתי מילים באנגלית: מלך + המקום שבו הים פוגש יבשה.'],
 spa:['בשעה הקרובה העבודה הכי קשה שלך תהיה לא לעשות כלום.','💆‍♀️ מישהו אחר יעבוד. את תשכבי.','🎒 יש סיבה שביקשנו בגד ים.'],
 qumran:['📅 המקום הבא כבר כמעט היה חלק מהסיפור שלנו פעם אחת.','❤️ היינו אמורים להיות שם בט״ו באב… אבל ביטלו לנו.','📜 השם שלו נשמע כאילו הוא שייך למגילות עתיקות.','🏺 מגילות. מערות. ים המלח.'],
 safe:['🏨 את לא צריכה לצאת מהחדר.','🔒 המקום נועד לשמור על דברים שלא משאירים סתם בחוץ.','🔢 הוא אוהב מספרים יותר ממפתחות.']
};
function hintBlock(id,hints){let n=S.hints[id]||0;let shown=hints.slice(0,n).map((h,i)=>`<div class="hint">HINT #${i+1}<br>${h}</div>`).join('');let btn=n<hints.length?`<button class="secondary" onclick="useHint('${id}')">${n?'עוד רמז':'תני לי רמז'} —5 🏆</button>`:'';return `<div id="h-${id}">${shown}${btn}</div>`}
function useHint(id){S.hints[id]=(S.hints[id]||0)+1;add(-5);renderLevel(S.level)}
function showPackingModal(){$('packingModal').classList.remove('hidden')} function closePackingModal(){S.done.packingConfirmed=true;save();$('packingModal').classList.add('hidden');refreshApprovalGate()}
function timer(btn,n=24,key=null){if(key&&S.done[key]){btn.textContent='COMPLETED ✓';btn.disabled=true;return}btn.disabled=true;let x=n;btn.textContent=x;let t=setInterval(()=>{x--;btn.textContent=x;if(x<=0){clearInterval(t);btn.textContent='COMPLETED ✓';if(key)S.done[key]=true;add(10);save();refreshApprovalGate()}},1000)}
function replay(id){const m={roomkey:'ב־Cafe Marie הופיע לרגע: ROOM KEY: 2',balloons:'במסך הראשון הופיעו 8 בלונים 🎈',file05:'בסיום הארכיון הופיע FILE 05',code04:'ב־GET READY הופיע CODE: 04'};alert(m[id]);add(-5)}
const REQUIRED={
  0:['p1','p2','p3','p4','packingConfirmed'],
  1:['b1','b2','b3','rabbinateAns'],
  2:['r1','r2','marieAns'],
  3:['c1','table10','c2','c3','c4','taAns'],
  4:['t1','road24','t2','hotelAns'],
  5:['h1','h2','hotel24','spaAns','spaReturned'],
  6:['a1','a2','a3','a4','a5','a6'],
  7:['ready24','g1','g2','g3','g4','qumAns'],
  8:['d1','d2','dinnerReturned','cp1','cp2','cp3']
};
function requiredFor(i){return REQUIRED[i]||[]}
function levelReady(i){return requiredFor(i).every(k=>S.done[k])}
function completionCount(i){let r=requiredFor(i);return [r.filter(k=>S.done[k]).length,r.length]}
function gateHTML(i,label='MISSION STATUS'){
  if(i>=9)return '';
  let [done,total]=completionCount(i);
  if(!levelReady(i))return `<div class="approval-gate" id="approvalGate"><h3>${label}</h3><div class="status">הושלמו ${done} מתוך ${total} משימות חובה.<br>השלב הבא יישאר נעול עד שכל המשימות יושלמו נכון.</div></div>`;
  return `<div class="approval-gate ready waiting" id="approvalGate"><h3>MISSION COMPLETE ✅</h3><div class="status"><b>NEXT DESTINATION: CLASSIFIED 🔒</b><br><br>Waiting for Game Master approval...</div></div>`;
}
function nextBtn(i,label='MISSION STATUS'){return gateHTML(i,label)}
function refreshApprovalGate(){let g=$('approvalGate');if(g&&Number.isInteger(S.level))g.outerHTML=gateHTML(S.level)}
function approveNextLevel(){
  let i=S.level;
  if(!Number.isInteger(i)||i>=9){alert('אין שלב הבא לאישור כרגע.');return}
  if(!levelReady(i)){alert('עדיין חסרות משימות חובה בשלב הזה.');return}
  if(!S.unlocked.includes(i+1))S.unlocked.push(i+1);
  S.level=i+1;S.substage='main';save();closeGM();renderLevel(i+1);
}
function renderStart(){$('topbar').classList.add('hidden');$('gmBtn').classList.add('hidden');screenEl.innerHTML=`<div class="hero"><div class="gold">18.08.2026</div><div style="font-size:28px">🎈🎈🎈🎈🎈🎈🎈🎈</div><h1>AMIT'S<br>BIRTHDAY<br>GAME</h1><p class="sub">SEASON 4 • PLAYER 01: AMIT • AGE 24</p><div class="card"><div class="small">RELATIONSHIP STATUS</div><h3>Somehow still with Nitay</h3></div><button onclick="start()">START GAME</button></div>`}
function start(){S.started=true;save();renderHome()}
function renderHome(){$('topbar').classList.remove('hidden');$('gmBtn').classList.remove('hidden');topUI();screenEl.innerHTML=`<div class="card"><div class="small">CURRENT MISSION</div><h2>${LEVELS[S.level]}</h2><button onclick="renderLevel(${S.level})">CONTINUE</button></div><div class="card"><h3>🚨 BIRTHDAY DISASTER METER™</h3><p>${S.disaster<20?'🟢 EVERYTHING SUSPICIOUSLY FINE':S.disaster<50?'🟠 WE MAY HAVE AN INCIDENT':'🔴 THIS IS NOW A STORY'}</p></div>${LEVELS.map((x,i)=>`<div class="route-item ${S.unlocked.includes(i)?'':'locked'}">${S.unlocked.includes(i)?(i===S.level?'▶':'✓'):'🔒'} ${S.unlocked.includes(i)?x:'CLASSIFIED'}</div>`).join('')}`}
function pauseSpa(){screenEl.innerHTML=`<div class="pause"><h1>GAME PAUSED</h1><p class="sub">לכי ליהנות מהספא. הטלפון יכול לחכות. ❤️</p><button onclick="returnFromSpa()">I'M BACK</button></div>`}
function returnFromSpa(){S.done.spaReturned=true;save();renderLevel(5)}

function renderLevel(i){
 if(Number.isInteger(i)){S.level=i;save()}$('topbar').classList.remove('hidden');$('gmBtn').classList.remove('hidden');let h=`<div class="hero"><div class="gold">LEVEL ${S.level}</div><h2>${LEVELS[S.level]}</h2></div>`;
 if(i===0){
 h+=`<div class="card"><p>מחר מתחיל המשחק. את לא יודעת לאן. את לא יודעת מה עושים. והטעות הראשונה שלך הייתה לתת לנתאי לתכנן הכול.</p><h3>MISSION: PACK YOUR SH*T 🎒</h3></div>`;
 h+=mcq('p1','מחר מישהו זר כנראה ייגע בך במשך כמעט שעה. מה כדאי שיהיה בתיק?',[{t:'צו הרחקה',ok:false,msg:'❌ ניסיון יפה.'},{t:'בגד ים',ok:true,msg:'✅ ITEM UNLOCKED: בגד ים.'},{t:'אפוד קרמי',ok:false,msg:'❌ זה לא מילואים.'},{t:'נתאי',ok:false,msg:'❌ הוא כבר מגיע בחבילה.'}]);
 h+=textQ('p2','בערב תצטרכי להיראות כאילו נתאי השקיע ביום הזה הרבה יותר ממה שהוא באמת השקיע. מה נכנס לתיק?',['שמלה','בגדי ערב','אאוטפיט','outfit'],'✅ EVENING MODE UNLOCKED 👗');
 h+=mcq('p3','מחר את בת 24. בערך כמה שעות כבר היית בעולם?',[{t:'≈24,000',ok:false,msg:'❌ נמוך מדי.'},{t:'≈210,000',ok:true,msg:'✅ EXISTENCE CONFIRMED.'},{t:'≈876,000',ok:false,msg:'❌ קשוח.'},{t:'יותר מדי בשביל לסבול את נתאי',ok:false,msg:'רגשית נכון.'}]);
 h+=mcq('p4','איזה מהדברים הבאים את הכי פחות צריכה לדעת כרגע?',[{t:'איפה ישנים',ok:false,msg:'❌'},{t:'מה עושים בצהריים',ok:false,msg:'❌'},{t:'איפה אוכלים בערב',ok:false,msg:'❌'},{t:'את כולם',ok:true,msg:'✅ CLASSIFIED MEANS CLASSIFIED.'}]);
 h+=`<div class="card"><h3>PACKING LIST UNLOCKED 🔓</h3><p>בגד ים • בגדי ערב • בגדים למחר • פיג׳מה • תחתונים/גרביים • כלי רחצה/טיפוח • מטען • משקפי שמש</p><button onclick="showPackingModal()">בדיקת תיק אחרונה ⚠️</button></div>`+nextBtn(0,'GET SOME SLEEP. TOMORROW WE PLAY.');
 }
 if(i===1){
 h+=`<div class="card"><h3>GOOD MORNING, BIRTHDAY GIRL 🎂</h3><p>24. יום הולדת אחרון לפני החתונה.</p><div class="small">CASE № 24-08</div></div>`;
